# frappe_docker's resources/core/nginx/nginx-template.conf, for one service that runs
# every process: upstreams on localhost, one fixed site, and Railway's edge in front.
upstream backend-server {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream socketio-server {
	server 127.0.0.1:9000 fail_timeout=0;
}

# Parse the X-Forwarded-Proto header - if set - defaulting to $scheme.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
	default $scheme;
	https https;
}

# Frappe's socket.io server accepts a connection only when Origin names the same host
# as Host, then calls Origin back to look up the user. The check is made here instead,
# so the call-back can go straight to this nginx rather than out through the public
# domain and back in.
map "$http_origin|$host" $same_origin {
	"~*^https?://([^/:|]+)(:[0-9]+)?\|\1$" 1;
	default 0;
}

server {
	listen ${PORT};
	listen [::]:${PORT};
	absolute_redirect off;
	root /home/frappe/frappe-bench/sites;

	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	include /etc/nginx/snippets/security_headers.conf;

	# Railway's edge sends X-Real-IP with the client's address, replacing any value the
	# client sent, so it can be trusted from any upstream address. (Its X-Forwarded-For
	# ends with the edge's own address, not the client's.)
	set_real_ip_from 0.0.0.0/0;
	set_real_ip_from ::/0;
	real_ip_header X-Real-IP;

	location /assets {
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /${SITE}/$1 =404;
	}

	location /socket.io {
		if ($same_origin = 0) {
			return 403;
		}
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name ${SITE};
		proxy_set_header Origin http://127.0.0.1:${PORT};
		proxy_set_header Host 127.0.0.1;

		proxy_pass http://socketio-server;
	}

	location / {
		rewrite ^(.+)/$ $1 permanent;
		rewrite ^(.+)/index\.html$ $1 permanent;
		rewrite ^(.+)\.html$ $1 permanent;

		location ~ ^/files/.*.(htm|html|svg|xml) {
			include /etc/nginx/snippets/security_headers.conf;
			add_header Content-disposition "attachment";
			try_files /${SITE}/public/$uri @webserver;
		}

		try_files /${SITE}/public/$uri @webserver;
	}

	location @webserver {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
		proxy_set_header X-Frappe-Site-Name ${SITE};
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;

		proxy_pass http://backend-server;
	}

	# optimizations
	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;

	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component;
}
